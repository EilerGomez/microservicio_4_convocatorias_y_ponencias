# application-dev.yml
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway maneja la BD, JPA solo valida
    show-sql: true              # En DEV mostramos las queries

  flyway:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# Variables de servicios externos
services:
  ms-auth:
    url: ${MS_AUTH_URL:http://localhost:8080}
  ms-congresos:
    url: ${MS_CONGRESOS_URL:http://localhost:8080}
  ms-actividades:
    url: ${MS_ACTIVIDADES_URL:http://localhost:8080}

logging:
  level:
    com.tugrupo.msponencias: DEBUG    # más detalle en DEV
    org.flywaydb: DEBUG
