# application-prod.yml
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false             # en PROD no mostramos queries

  flyway:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

services:
  ms-auth:
    url: ${MS_AUTH_URL}
  ms-congresos:
    url: ${MS_CONGRESOS_URL}
  ms-actividades:
    url: ${MS_ACTIVIDADES_URL}

logging:
  level:
    com.tugrupo.msponencias: WARN   # menos ruido en PROD
    org.flywaydb: INFO
